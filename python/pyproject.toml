[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "batts-gpu"
version = "0.1.0"
description = "GPU boosting for two-sample density ratios: a PyTorch port of the boosting part of the R package BATTS"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = ["numpy", "torch>=2.0"]

[tool.setuptools]
packages = ["batts_gpu"]
